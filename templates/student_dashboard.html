<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - CPMS</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">CPMS - Student</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <button class="btn btn-danger" onclick="Utils.logout()">Logout</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid py-4">
        <!-- Dashboard Header -->
        <div class="dashboard-header">
            <h2>Student Dashboard</h2>
            <p class="text-secondary mb-0">Manage your profile and apply for jobs</p>
        </div>

        <!-- Tabs -->
        <ul class="nav nav-tabs mb-4" role="tablist">
            <li class="nav-item">
                <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#profile">Profile</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#jobs">Available Jobs</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#applications">My Applications</button>
            </li>
        </ul>

        <!-- Tab Content -->
        <div class="tab-content">
            <!-- Profile Tab -->
            <div class="tab-pane fade show active" id="profile">
                <div class="row">
                    <div class="col-lg-8">
                        <div class="card">
                            <div class="card-header">
                                <h4 class="mb-0">Complete Your Profile</h4>
                            </div>
                            <div class="card-body">
                                <form id="profileForm">
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Full Name *</label>
                                            <input type="text" class="form-control" id="name" required>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Roll Number *</label>
                                            <input type="text" class="form-control" id="roll_no" required>
                                        </div>
                                    </div>
                                    
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Branch *</label>
                                            <select class="form-select" id="branch" required>
                                                <option value="">Select Branch</option>
                                                <option value="CSE">Computer Science & Engineering</option>
                                                <option value="IT">Information Technology</option>
                                                <option value="ECE">Electronics & Communication</option>
                                                <option value="EEE">Electrical & Electronics</option>
                                                <option value="MECH">Mechanical Engineering</option>
                                                <option value="CIVIL">Civil Engineering</option>
                                            </select>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">CGPA *</label>
                                            <input type="number" step="0.01" min="0" max="10" class="form-control" id="cgpa" required>
                                        </div>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label class="form-label">Skills (comma-separated)</label>
                                        <input type="text" class="form-control" id="skills" placeholder="Python, Java, Web Development">
                                    </div>
                                    
                                    <button type="submit" class="btn btn-primary">Save Profile</button>
                                </form>
                            </div>
                        </div>
                        
                        <!-- Resume Upload -->
                        <div class="card mt-4">
                            <div class="card-header">
                                <h4 class="mb-0">Upload Resume</h4>
                            </div>
                            <div class="card-body">
                                <form id="resumeForm">
                                    <div class="mb-3">
                                        <input type="file" class="form-control" id="resume" accept=".pdf" required>
                                        <small class="text-secondary">Only PDF files allowed</small>
                                    </div>
                                    <button type="submit" class="btn btn-primary">Upload Resume</button>
                                </form>
                                <div id="resumeStatus" class="mt-3"></div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-lg-4">
                        <div class="card">
                            <div class="card-header">
                                <h4 class="mb-0">Profile Status</h4>
                            </div>
                            <div class="card-body" id="profileStatus">
                                <p class="text-secondary">Loading...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Jobs Tab -->
            <div class="tab-pane fade" id="jobs">
                <div class="card">
                    <div class="card-header">
                        <h4 class="mb-0">Available Job Opportunities</h4>
                    </div>
                    <div class="card-body">
                        <div id="jobsList">
                            <p class="text-center">Loading...</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Applications Tab -->
            <div class="tab-pane fade" id="applications">
                <div class="card">
                    <div class="card-header">
                        <h4 class="mb-0">My Applications</h4>
                    </div>
                    <div class="card-body">
                        <div id="applicationsList">
                            <p class="text-center">Loading...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Quiz Modal -->
    <div class="modal fade" id="quizModal" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Job Application Quiz</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="quizContent">
                        <p class="text-center">Loading quiz...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/main.js"></script>
    <script>
        // Check authentication
        if (!Utils.checkAuth() || TokenManager.getRole() !== 'student') {
            window.location.href = '/login';
        }

        // Load profile on page load
        loadProfile();

        // Profile Form
        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const skills = document.getElementById('skills').value.split(',').map(s => s.trim()).filter(s => s);
            
            const data = {
                name: document.getElementById('name').value,
                roll_no: document.getElementById('roll_no').value,
                branch: document.getElementById('branch').value,
                cgpa: parseFloat(document.getElementById('cgpa').value),
                skills: skills
            };
            
            try {
                await API.post('/student/profile', data);
                Utils.showToast('Profile updated successfully!', 'success');
                loadProfile();
            } catch (error) {
                Utils.showToast(error.message, 'danger');
            }
        });

        // Resume Upload
        document.getElementById('resumeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fileInput = document.getElementById('resume');
            const file = fileInput.files[0];
            
            if (!file) {
                Utils.showToast('Please select a file', 'warning');
                return;
            }
            
            const formData = new FormData();
            formData.append('resume', file);
            
            try {
                const result = await API.uploadFile('/student/upload-resume', formData);
                Utils.showToast(result.message, 'success');
                loadProfile();
            } catch (error) {
                Utils.showToast(error.message, 'danger');
            }
        });

        // Load Profile
        async function loadProfile() {
            try {
                const profile = await API.get('/student/profile');
                
                // Fill form
                document.getElementById('name').value = profile.name || '';
                document.getElementById('roll_no').value = profile.roll_no || '';
                document.getElementById('branch').value = profile.branch || '';
                document.getElementById('cgpa').value = profile.cgpa || '';
                document.getElementById('skills').value = (profile.skills || []).join(', ');
                
                // Update status
                const statusDiv = document.getElementById('profileStatus');
                statusDiv.innerHTML = `
                    <div class="mb-3">
                        <strong>Name:</strong> ${profile.name || 'Not set'}
                    </div>
                    <div class="mb-3">
                        <strong>Branch:</strong> ${profile.branch || 'Not set'}
                    </div>
                    <div class="mb-3">
                        <strong>CGPA:</strong> ${profile.cgpa || 'Not set'}
                    </div>
                    <div class="mb-3">
                        <strong>Resume:</strong> ${profile.resume_url ? '✅ Uploaded' : '❌ Not uploaded'}
                    </div>
                    <div>
                        <strong>Status:</strong> ${profile.placed ? '<span class="badge bg-success">Placed</span>' : '<span class="badge bg-warning">Not Placed</span>'}
                    </div>
                `;
            } catch (error) {
                console.log('Profile not found');
            }
        }

        // Load Jobs
        async function loadJobs() {
            try {
                const jobs = await API.get('/student/jobs');
                const jobsList = document.getElementById('jobsList');
                
                if (jobs.length === 0) {
                    jobsList.innerHTML = '<p class="text-center text-secondary">No eligible jobs available</p>';
                    return;
                }
                
                jobsList.innerHTML = jobs.map(job => `
                    <div class="card mb-3">
                        <div class="card-body">
                            <h5>${job.job_title}</h5>
                            <p class="text-secondary mb-2"><strong>Company:</strong> ${job.company_name}</p>
                            <p class="mb-2">${job.job_description || 'No description'}</p>
                            <div class="mb-2">
                                <span class="badge bg-info">Min CGPA: ${job.criteria.min_cgpa}</span>
                                <span class="badge bg-primary">${job.criteria.branches.join(', ')}</span>
                            </div>
                            <button class="btn btn-success btn-sm" onclick="applyJob('${job._id}')">Apply Now</button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                document.getElementById('jobsList').innerHTML = `<p class="text-danger">${error.message}</p>`;
            }
        }

        // Apply for Job
        async function applyJob(jobId) {
            try {
                await API.post('/student/apply', { job_id: jobId });
                Utils.showToast('Application submitted successfully!', 'success');
                loadApplications();
            } catch (error) {
                Utils.showToast(error.message, 'danger');
            }
        }

        // Load Applications
        async function loadApplications() {
            try {
                const applications = await API.get('/student/applications');
                const appsList = document.getElementById('applicationsList');
                
                if (applications.length === 0) {
                    appsList.innerHTML = '<p class="text-center text-secondary">No applications yet</p>';
                    return;
                }
                
                appsList.innerHTML = `
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Company</th>
                                <th>Job Title</th>
                                <th>Applied On</th>
                                <th>Status</th>
                                <th>Quiz</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${applications.map(app => `
                                <tr>
                                    <td>${app.company.company_name}</td>
                                    <td>${app.job.job_title}</td>
                                    <td>${Utils.formatDate(app.applied_at)}</td>
                                    <td>${getStatusBadge(app.status)}</td>
                                    <td>
                                        ${app.quiz_required ? (app.quiz_completed ? '<span class="badge bg-success">Quiz Completed</span>' : `<button class="btn btn-sm btn-info" onclick="startQuiz('${app.job_id}')">Take Quiz</button>`) : '<span class="text-secondary">No quiz</span>'}
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } catch (error) {
                document.getElementById('applicationsList').innerHTML = `<p class="text-danger">${error.message}</p>`;
            }
        }

        function getStatusBadge(status) {
            const badges = {
                'applied': '<span class="badge bg-info">Applied</span>',
                'shortlisted': '<span class="badge bg-success">Shortlisted</span>',
                'rejected': '<span class="badge bg-danger">Rejected</span>'
            };
            return badges[status] || status;
        }

        // Quiz Functions
        let currentQuiz = null;
        let quizAnswers = [];

        async function startQuiz(jobId) {
            try {
                const quiz = await API.get(`/student/quiz/${jobId}`);
                currentQuiz = quiz;
                quizAnswers = new Array(quiz.questions.length).fill(null);
                
                const modal = new bootstrap.Modal(document.getElementById('quizModal'));
                renderQuiz(quiz);
                modal.show();
                
                // Start timer if duration is set
                if (quiz.duration) {
                    startQuizTimer(quiz.duration);
                }
            } catch (error) {
                Utils.showToast('No quiz available for this job', 'warning');
            }
        }

        function renderQuiz(quiz) {
            const content = document.getElementById('quizContent');
            content.innerHTML = `
                <div class="mb-3">
                    <h4>${quiz.title}</h4>
                    ${quiz.duration ? `<p class="text-secondary">Duration: ${quiz.duration} minutes</p>` : ''}
                </div>
                <form id="quizForm">
                    ${quiz.questions.map((q, index) => `
                        <div class="card mb-3">
                            <div class="card-body">
                                <h6>Question ${index + 1}: ${q.question}</h6>
                                ${q.options.map((option, optIndex) => `
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="question${index}" value="${optIndex}" id="q${index}o${optIndex}">
                                        <label class="form-check-label" for="q${index}o${optIndex}">
                                            ${String.fromCharCode(65 + optIndex)}. ${option}
                                        </label>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `).join('')}
                    <button type="submit" class="btn btn-primary">Submit Quiz</button>
                </form>
            `;
            
            // Add event listeners for radio buttons
            quiz.questions.forEach((_, index) => {
                document.querySelectorAll(`input[name="question${index}"]`).forEach(radio => {
                    radio.addEventListener('change', (e) => {
                        quizAnswers[index] = parseInt(e.target.value);
                    });
                });
            });
            
            // Add submit handler
            document.getElementById('quizForm').addEventListener('submit', submitQuiz);
        }

        function startQuizTimer(duration) {
            let timeLeft = duration * 60; // Convert to seconds
            const timerElement = document.createElement('div');
            timerElement.id = 'quizTimer';
            timerElement.className = 'alert alert-info';
            timerElement.innerHTML = `<strong>Time Remaining: <span id="timeDisplay">${formatTime(timeLeft)}</span></strong>`;
            
            document.getElementById('quizContent').prepend(timerElement);
            
            const timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timeDisplay').textContent = formatTime(timeLeft);
                
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    submitQuiz();
                }
            }, 1000);
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        async function submitQuiz(e) {
            if (e) e.preventDefault();
            
            try {
                const response = await API.post('/student/submit-quiz', {
                    quiz_id: currentQuiz._id,
                    answers: quizAnswers
                });
                
                const modal = bootstrap.Modal.getInstance(document.getElementById('quizModal'));
                modal.hide();
                
                Utils.showToast(`Quiz submitted! Your score: ${response.score}/${response.score + (quizAnswers.length - response.score)}`, 'success');
                loadApplications(); // Refresh applications to show updated status
            } catch (error) {
                Utils.showToast(error.message, 'danger');
            }
        }

        // Tab change events
        document.querySelector('button[data-bs-target="#jobs"]').addEventListener('click', loadJobs);
        document.querySelector('button[data-bs-target="#applications"]').addEventListener('click', loadApplications);
    </script>
</body>
</html>
