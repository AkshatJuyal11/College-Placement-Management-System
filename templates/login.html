<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CPMS</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-surface">
    <div class="container">
        <div class="row justify-content-center align-items-center" style="min-height: 100vh;">
            <div class="col-md-5">
                <div class="card">
                    <div class="card-header text-center">
                        <h3 class="mb-0">🎓 Login to CPMS</h3>
                    </div>
                    <div class="card-body">
                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label">Email Address</label>
                                <input type="email" class="form-control" id="email" placeholder="your.email@college.edu" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                            </div>
                            
                            <div id="errorMessage" class="alert alert-danger d-none"></div>
                            
                            <button type="submit" class="btn btn-primary w-100 mb-3" id="loginBtn">
                                Login
                            </button>
                            
                            <div class="text-center">
                                <p class="mb-0">Don't have an account? <a href="/register">Register here</a></p>
                            </div>
                        </form>
                    </div>
                </div>
                
                <div class="text-center mt-3">
                    <a href="/" class="text-secondary">← Back to Home</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/main.js"></script>
    <script>
        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');
        const loginBtn = document.getElementById('loginBtn');
        
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // Validation
            if (!FormValidator.email(email)) {
                showError('Please enter a valid email address');
                return;
            }
            
            if (!FormValidator.password(password)) {
                showError('Password must be at least 6 characters');
                return;
            }
            
            // Show loading
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Logging in...';
            
            try {
                const response = await API.post('/auth/login', { email, password });
                
                // Save token and user info
                TokenManager.set(response.token);
                TokenManager.setRole(response.role);
                TokenManager.setUserId(response.user_id);
                
                // Redirect based on role
                switch(response.role) {
                    case 'student':
                        window.location.href = '/student-dashboard';
                        break;
                    case 'company':
                        window.location.href = '/company-dashboard';
                        break;
                    case 'admin':
                        window.location.href = '/admin-dashboard';
                        break;
                }
            } catch (error) {
                showError(error.message);
                loginBtn.disabled = false;
                loginBtn.innerHTML = 'Login';
            }
        });
        
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.remove('d-none');
            setTimeout(() => {
                errorMessage.classList.add('d-none');
            }, 5000);
        }
    </script>
</body>
</html>
